<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خريطة مخططات وأراضي حي عريض التفاعلية | شركة ركن الحراملة العقارية</title>
  <meta name="description" content="استعرض مخططات وقطع أراضي حي عريض بالرياض تفاعلياً، ابحث برقم المخطط ورقم القطعة واستفسر مباشرة عبر شركة ركن الحراملة العقارية.">
  
  <link rel="icon" type="image/png" href="../images/S-gold-black-logo.png">

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Custom Map CSS -->
  <link rel="stylesheet" href="css/map.css">
</head>
<body>

  <!-- Fullscreen Map Canvas -->
  <div id="map-container"></div>

  <!-- UI Controls Layer (Hidden automatically in ?bg=1 mode) -->
  <div class="map-ui-layer">
    <!-- Top Header -->
    <header class="map-header">
      <div class="map-brand">
        <img src="../images/L-gold-black-logo.png" alt="شركة ركن الحراملة العقارية" class="map-brand-logo" onerror="this.onerror=null; this.src='../images/S-gold-black-logo.png';">
        <div class="map-brand-text">
          <h1>خريطة مخططات حي عريض التفاعلية</h1>
          <p>شركة ركن الحراملة العقارية • الرياض</p>
        </div>
      </div>

      <div class="map-header-actions">
        <a href="../index.html" class="btn-back-home">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          <span>العودة للموقع</span>
        </a>
      </div>
    </header>

    <!-- Floating Filter & Search Panel -->
    <div class="map-controls-panel">
      <!-- Search Card -->
      <div class="map-search-card">
        <div class="search-input-group">
          <svg width="18" height="18" fill="none" stroke="#C5A059" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input 
            type="text" 
            id="map-search-input" 
            placeholder="ابحث برقم المخطط أو القطعة (مثال: 2744 أو 101)..."
          >
        </div>
      </div>

      <!-- Quick Plan Switcher Pills -->
      <div class="plan-pills">
        <button class="plan-pill active" data-plan="2744" onclick="selectPlan('2744')">مخطط 2744</button>
        <button class="plan-pill" data-plan="2745" onclick="selectPlan('2745')">مخطط 2745 (الذهبي)</button>
        <button class="plan-pill" data-plan="2746" onclick="selectPlan('2746')">مخطط 2746 (الأمني)</button>
        <button class="plan-pill" data-plan="2702" onclick="selectPlan('2702')">مخطط 2702</button>
        <button class="plan-pill" data-plan="3097" onclick="selectPlan('3097')">مخطط 3097</button>
        <button class="plan-pill" onclick="showAllAreed()">عرض عريض كاملة</button>
      </div>
    </div>

    <!-- Selected Parcel Details Drawer / Bottom Sheet -->
    <div id="parcel-drawer" class="parcel-drawer">
      <div class="parcel-drawer-header">
        <div class="parcel-drawer-title">
          <h3 id="drawer-plan-title">مخطط 2744 • قطعة 101</h3>
          <p id="drawer-sector">سكني • ضاحية عريض</p>
        </div>
        <button class="btn-close-drawer" onclick="closeParcelDrawer()" title="إغلاق">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Specifications Grid -->
      <div class="parcel-specs-grid">
        <div class="spec-cell">
          <span class="spec-cell-label">المساحة</span>
          <span id="drawer-area" class="spec-cell-val">450 م²</span>
        </div>
        <div class="spec-cell">
          <span class="spec-cell-label">الشارع</span>
          <span id="drawer-streets" class="spec-cell-val">20م شمالي</span>
        </div>
        <div class="spec-cell">
          <span class="spec-cell-label">الأبعاد</span>
          <span id="drawer-dimensions" class="spec-cell-val">15م × 30م</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="parcel-actions">
        <a id="drawer-whatsapp-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-drawer-whatsapp">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          <span>استفسر عن هذه القطعة</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Map Engine Script -->
  <script src="js/map.js"></script>
</body>
</html>
